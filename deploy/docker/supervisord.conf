[supervisord]
nodaemon=true                   ; Run supervisord in the foreground
logfile=/dev/null               ; Log supervisord output to stdout/stderr
logfile_maxbytes=0

; Local control socket (container-internal only) so `docker exec ... supervisorctl
; status/stop/start` works for the programs below.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
; Virtual framebuffer for the headful nodriver worker. CF managed
; "Just a moment" interstitials do not clear in plain headless on this stack;
; with a real X display they resolve in ~10-30s.
command=Xvfb :99 -screen 0 1366x900x24 -nolisten tcp -ac
user=appuser
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nodriver-worker]
; nodriver (AGPL-3.0) stealth crawl worker. Own venv at /opt/nodriver-worker,
; FastAPI on port 8001 (POST /md, GET /health). Container-internal binding:
; reachable from the host only via an explicit -p 8001 mapping, or from other
; containers on the same docker network (the production fallback path).
; AGPL isolation: nothing outside this program ever imports nodriver.
; run.sh waits for the Xvfb socket (:99) before launching in headful mode.
command=/opt/nodriver-worker/run.sh
directory=/opt/nodriver-worker
user=appuser
autorestart=true
priority=15
environment=DISPLAY=":99",NODRIVER_STEALTH_ENABLED="true",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
; Loopback-only and password-protected. REDIS_PASSWORD is exported by
; entrypoint.sh from the mounted secret; the app must supply it to connect.
command=/usr/bin/redis-server --loglevel notice --bind 127.0.0.1 ::1 --requirepass "%(ENV_REDIS_PASSWORD)s" --dir /var/lib/redis
user=appuser                    ; Run redis as our non-root user
autorestart=true
priority=10
stdout_logfile=/dev/stdout      ; Redirect redis stdout to container stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr      ; Redirect redis stderr to container stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
; Bind is resolved by entrypoint.sh into GUNICORN_BIND: loopback unless a
; credential (CRAWL4AI_API_TOKEN) is present, in which case the operator may
; expose 0.0.0.0. gunicorn is the authoritative socket-level guard; the Python
; _resolve_auth() check is the in-process guard - both must agree.
; --workers 3 (was 1): 3 independent event loops / browser pools -> ~3x crawl
; throughput. Each worker owns its own chrome pool, so mem_limit must be raised
; (4G -> 8G in docker-compose.custom.yaml) or the workers OOM. See wellisearch
; tuning 2026-08: single worker capped at ~16 concurrent pages (~25-40/min);
; 3 workers sustains ~110/min.
command=/usr/local/bin/gunicorn --bind "%(ENV_GUNICORN_BIND)s" --workers 3 --threads 4 --timeout 1800 --graceful-timeout 30 --keep-alive 300 --log-level info --limit-request-line 8190 --limit-request-fields 100 --worker-class uvicorn.workers.UvicornWorker server:app
directory=/app                  ; Working directory for the app
user=appuser                    ; Run gunicorn as our non-root user
autorestart=true
priority=20
environment=PYTHONUNBUFFERED=1  ; Ensure Python output is sent straight to logs
stdout_logfile=/dev/stdout      ; Redirect gunicorn stdout to container stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr      ; Redirect gunicorn stderr to container stderr
stderr_logfile_maxbytes=0

# Optional: Add filebeat or other logging agents here if needed
